<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Preview Tool</title>
<style>
body{font-family:Arial;background:#f1f5f9;padding:25px;text-align:center}
main{max-width:650px;margin:auto;background:white;padding:30px;border-radius:15px}
input{max-width:100%;padding:15px}
img{max-width:100%;max-height:400px;border-radius:10px;margin-top:20px}
#info{line-height:2;color:#475569;white-space:pre-line}
button{background:#334155;color:white;padding:12px 20px;border:0;border-radius:8px;cursor:pointer}
</style>
</head>
<body>
<main>
<h1>Image Preview Tool</h1>
<p>Preview images directly in your browser.</p>
<input id="file" type="file" accept="image/*" onchange="preview()">
<br>
<img id="image" alt="Selected image preview" hidden>
<p id="info"></p>
<button onclick="clearImage()">Clear Image</button>
</main>
<script>
let url=null;
function preview(){
 const file=document.getElementById("file").files[0];
 if(!file)return;
 if(url)URL.revokeObjectURL(url);
 url=URL.createObjectURL(file);
 const img=document.getElementById("image");
 img.onload=()=>{
  img.hidden=false;
  document.getElementById("info").textContent=
  "File: "+file.name+
  "\nSize: "+(file.size/1024).toFixed(2)+" KB"+
  "\nResolution: "+img.naturalWidth+" × "+img.naturalHeight;
 };
 img.onerror=()=>{
  img.hidden=true;
  document.getElementById("info").textContent="Unable to display this image.";
 };
 img.src=url;
}
function clearImage(){
 if(url)URL.revokeObjectURL(url);
 url=null;
 document.getElementById("file").value="";
 const img=document.getElementById("image");
 img.removeAttribute("src");
 img.hidden=true;
 document.getElementById("info").textContent="";
}
</script>
</body>
</html>
